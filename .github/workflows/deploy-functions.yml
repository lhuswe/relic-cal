name: Deploy edge functions

# Deployar feed-funktionen till Supabase automatiskt när den ändras.
# Kräver repo-secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy feed
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy feed --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
