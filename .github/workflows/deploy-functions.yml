name: Deploy edge functions

# Deployar feed-funktionen till Supabase.
# Kräver repo-secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF.
#
# Manuell körning tills secrets är satta. När de finns kan push-triggern nedan
# aktiveras igen så att funktionen deployas automatiskt när den ändras:
#   push:
#     branches: [main]
#     paths: ['supabase/functions/**']
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy feed
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy feed --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
